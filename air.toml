# This file is *not* what mep uses to format R any more: `gf` on an R
# buffer runs mep's own formatter (src/r_format.cpp, mep.format_languages.R
# in kBuiltinFormat, src/main.cpp), which takes its 80-column margin from
# that entry's own `width` field and reads nothing from disk.
#
# It is kept for anyone running `air format` over this repo by hand, and
# because air's own default is already 80, pinning it makes the margin an
# explicit project decision rather than a default that could move.
[format]
line-width = 80
