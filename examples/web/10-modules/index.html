<script>
// Classic scripts run before deferred module scripts; if no module ever
// runs, this timeout reports it instead of leaving the page "RUNNING".
setTimeout(function () {
  if (!window.__moduleRan) { Harness.check('module script executed', false, 'type=module never ran'); Harness.done(); }
}, 1500);
</script>
