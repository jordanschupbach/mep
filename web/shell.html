<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mep</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script type="text/javascript">
      var Module = {
        canvas: document.getElementById("canvas"),
        print: function (text) { console.log(text); },
        printErr: function (text) { console.error(text); },
        onAbort: function (what) { console.error("wasm aborted:", what); },
      };
      // launcher/serve.ts passes its loopback file-bridge HTTP server's port
      // via the file:// URL's query string (no other way to hand data to a
      // file:// page at load time without an async round trip). Absent when
      // mep.html is opened directly in a plain browser tab, which is how
      // src/editor.cpp's EM_ASYNC_JS bridge calls detect "no bridge here".
      var __mepBridgePort = new URLSearchParams(location.search).get("bridgePort");
      window.__mepBridgeBase = __mepBridgePort ? ("http://127.0.0.1:" + __mepBridgePort) : null;

      // WebKitGTK (the native-webview deployment launcher/webview_worker.ts
      // opens this page in) applies its own browser-chrome default actions
      // to Ctrl/Cmd/Alt key combos -- Select All, Print, history navigation,
      // etc. -- same as any browser would. The canvas is the entire UI here
      // with no native-editable content for those to usefully act on, so
      // they just silently steal keys mep binds for its own commands
      // instead (Ctrl-N/Ctrl-P for picker/completion navigation, mod1+hjkl
      // for panes, a picker's own Ctrl-<letter> shortcuts, ...). Confirmed
      // concretely for Ctrl-A (a picker's "add current directory" shortcut):
      // in the native (non-webview) build it worked correctly, but here the
      // key never reached the wasm layer at all -- instead the whole canvas
      // got WebKit's default text-selection highlight, a blue tint with no
      // relation to mep's own rendering. preventDefault() on keydown (any
      // phase, any listener) is sufficient to suppress the browser's own
      // default action for that key without affecting Emscripten's own
      // keydown handling, which still sees the (not propagation-stopped)
      // event normally.
      window.addEventListener("keydown", function (e) {
        if (
          (e.ctrlKey || e.metaKey || e.altKey) &&
          e.key !== "Control" && e.key !== "Meta" && e.key !== "Alt" && e.key !== "Shift"
        ) {
          e.preventDefault();
        }
      }, true);
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
